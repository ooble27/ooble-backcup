<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Avant l'affichage : thème sombre, et version anglaise si c'est la langue choisie.
      try {
        var h = document.documentElement, p = location.pathname;
        var dark = localStorage.getItem("ooble.theme") === "dark";
        if (dark) h.classList.add("dark");
        // iPhone / iPad (iOS 26) : la barre d'état prend la couleur du tout premier affichage et ne la
        // change plus. On fixe donc tout de suite le thème d'Ooble (et non celui du téléphone) et la
        // couleur exacte de la page ouverte, pour qu'aucune bande d'une autre couleur n'apparaisse.
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", dark ? "dark" : "light");
        var wide = innerWidth >= 768, bg;
        if (/^\/admin(\/|$)/.test(p)) bg = wide ? (dark ? "#171717" : "#e9e9e5") : (dark ? "#1a1a1a" : "#f5f5f3");
        else if (/^\/app(\/|$)/.test(p)) { h.classList.add("app-scope"); bg = dark ? "#171717" : "#f5f5f3"; }
        else bg = dark ? "#1a1a1a" : "#ffffff";
        h.style.backgroundColor = bg;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", bg);
        if (localStorage.getItem("ooble.lang") === "en" && !/^\/(en|app|admin)(\/|$)/.test(p))
          location.replace((p === "/" ? "/en" : "/en" + p) + location.search + location.hash);
      } catch (e) {}
    </script>
    <title>Ooble · Achetez et vendez des USDT en dollars canadiens</title>

    <!-- PWA : installable, plein écran, logo Ooble -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ooble" />
    <meta
      data-seo
      name="description"
      content="Ooble : achetez et vendez des USDT en dollars canadiens par Interac e-Transfer. Non-custodial : vos fonds vont directement dans votre wallet."
    />

    <!-- Aperçu de partage (réseaux sociaux, WhatsApp, iMessage…) -->
