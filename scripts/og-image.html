<!--
  Source de public/og-image.png (aperçu de partage — réseaux sociaux, WhatsApp).

  Composition à deux panneaux plutôt qu'une capture de la section héros :
  panneau blanc à gauche (logo, titre, pastille) au même thème « noir et
  blanc » que la landing page — pas de fond de couleur, pas de texture —,
  panneau blanc à droite avec la pièce USDC au centre d'une orbite, et les
  quatre réseaux ouverts autour (BNB Chain, Polygon, Solana, Avalanche).
  Les pièces viennent de public/coins/ (mêmes fichiers que le site).

  FONT_500/600 sont des marqueurs à remplacer par les polices Poppins
  (fichier .ttf, ou "data:font/ttf;base64,<contenu>") avant capture.
  Pour régénérer :

    1. Remplacer FONT_500 et FONT_600 par les fichiers Poppins Medium et SemiBold.
    2. Capturer ce HTML depuis le dossier scripts/ (les pièces sont lues dans
       ../public/coins/) en 1200×630, device scale 1, avec un navigateur headless.
    3. Enregistrer le résultat dans public/og-image.png.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "Poppins"; font-weight: 500; src: url("FONT_500") format("truetype"); }
  @font-face { font-family: "Poppins"; font-weight: 600; src: url("FONT_600") format("truetype"); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    font-family: "Poppins", sans-serif;
    position: relative;
    overflow: hidden;
    background: #ffffff;
  }

  /* ---------- Panneau gauche : même thème que la landing page (blanc, encre) ---------- */
  .panel-left {
    position: absolute;
    inset: 0;
    width: 700px;
    background: #ffffff;
    border-right: 1px solid #e6e6e6;
    overflow: hidden;
  }

  .logo {
    position: absolute;
    top: 56px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .logo-mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #0f343e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-word {
    font-weight: 600;
    font-size: 22px;
    color: #171717;
    letter-spacing: -0.02em;
  }

  .left-content {
    position: relative;
    height: 100%;
    padding: 40px 72px 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  h1 {
    font-weight: 500;
    font-size: 50px;
    line-height: 1.05;
    letter-spacing: -0.03em;
    color: #171717;
  }
  h1 .accent {
    color: rgba(23,23,23,0.32);
  }

  p.sub {
    margin-top: 24px;
    font-weight: 500;
    font-size: 19px;
    line-height: 1.55;
    color: #666666;
    max-width: 440px;
  }

  .badges {
    margin-top: 34px;
    display: flex;
    gap: 10px;
  }
  .badge {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px;
    border-radius: 999px;
    background: #f5f5f5;
    font-weight: 600;
    font-size: 15px;
    color: #171717;
  }
  .badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #29998e;
  }

  /* ---------- Panneau droit : blanc, illustration de marque ---------- */
  .panel-right {
    position: absolute;
    inset: 0;
    left: 700px;
    width: 500px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .orbit { position: relative; width: 380px; height: 380px; }
  .ring { position: absolute; inset: 20px; border-radius: 50%; border: 2.5px dashed rgba(15,52,62,.22); }
  .usdc { position: absolute; left: 95px; top: 95px; width: 190px; height: 190px; border-radius: 50%; box-shadow: 0 18px 40px rgba(39,117,202,.25); }
  .net { position: absolute; width: 74px; height: 74px; border-radius: 50%; box-shadow: 0 0 0 6px #ffffff; }
  .n1 { left: 153px; top: -17px; }
  .n2 { right: -17px; top: 153px; }
  .n3 { left: 153px; bottom: -17px; }
  .n4 { left: -17px; top: 153px; }

  .domain {
    position: absolute;
    right: 36px;
    bottom: 26px;
    font-weight: 500;
    font-size: 14px;
    color: rgba(23,23,23,0.3);
  }
</style>
</head>
<body>
  <div class="panel-left">
    <div class="logo">
      <span class="logo-mark">
        <svg viewBox="0 0 32 32" width="24" height="24">
          <circle cx="12.5" cy="16" r="4.6" fill="none" stroke="#29998e" stroke-width="2.6" />
          <circle cx="20.5" cy="16" r="4.6" fill="none" stroke="#ffffff" stroke-width="2.6" />
        </svg>
      </span>
      <span class="logo-word">Ooble</span>
    </div>

    <div class="left-content">
      <h1>Achetez et<br />vendez de l'USDC<br /><span class="accent">en dollars canadiens</span></h1>
      <p class="sub">Payez par Interac. Vos USDC arrivent directement dans votre portefeuille. Ooble ne garde aucun solde.</p>
      <div class="badges">
        <span class="badge"><span class="dot"></span>Interac e-Transfer</span>
        <span class="badge"><span class="dot"></span>4 réseaux</span>
        <span class="badge"><span class="dot"></span>Non-custodial</span>
      </div>
    </div>
  </div>

  <div class="panel-right">
    <!-- La pièce USDC au centre d'une orbite, les quatre réseaux autour. -->
    <div class="orbit">
      <span class="ring"></span>
      <img class="usdc" src="../public/coins/usdc.svg" alt="" />
      <img class="net n1" src="../public/coins/bnb.svg" alt="" />
      <img class="net n2" src="../public/coins/matic.svg" alt="" />
      <img class="net n3" src="../public/coins/sol.svg" alt="" />
      <img class="net n4" src="../public/coins/avax.svg" alt="" />
    </div>
  </div>

  <div class="domain">ooble.ca</div>
</body>
</html>
