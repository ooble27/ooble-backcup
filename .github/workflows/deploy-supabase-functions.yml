name: Déploiement fonctions edge Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

# Un seul déploiement à la fois. Toute nouvelle exécution annule celles
# en cours ou en queue — évite qu'une queue vieille de 15 minutes fasse
# expirer les runs plus récents et bloque les correctifs.
concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: true

jobs:
  deploy:
    # Seul le dépôt principal déploie. Le dépôt de sauvegarde (copie du code)
    # n'a pas la clé Supabase : sans cette condition, chaque envoi y échoue
    # et GitHub envoie un courriel d'échec.
    if: github.repository == 'ooble27/Ooble-'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          supabase functions deploy send-email --project-ref uukxacjjviiktmbikdwp
          supabase functions deploy ai-assist --project-ref uukxacjjviiktmbikdwp
          supabase functions deploy mail-webhook --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy push-notify --project-ref uukxacjjviiktmbikdwp
          supabase functions deploy order-notify --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy usdt-payout --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy interac-ingest --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy sumsub-webhook --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy sell-watch --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy delete-account --project-ref uukxacjjviiktmbikdwp
          supabase functions deploy reset-test-data --project-ref uukxacjjviiktmbikdwp
          supabase functions deploy admin-tools --project-ref uukxacjjviiktmbikdwp
          supabase functions deploy refresh-rate --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy campaign-dispatch --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy mail-events --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy journeys --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy push-campaign --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy team-notify --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
          supabase functions deploy kyc-check --project-ref uukxacjjviiktmbikdwp --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
